<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inspiration Hub · 工业设计与材质先锋</title>
  <style>
    :root {
      --bg-color: #f7f7f8;
      --card-bg: #ffffff;
      --text-main: #1a1a1a;
      --text-muted: #666666;
      --accent: #ff4500;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 2rem 1rem;
    }
    .container {
      max-width: 1280px;
      margin: 0 auto;
    }
    header {
      margin-bottom: 3rem;
      text-align: center;
    }
    header h1 {
      font-size: 2.5rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin-bottom: 0.5rem;
    }
    header p {
      color: var(--text-muted);
      font-size: 1.1rem;
    }
    /* 状态指示器 */
    .status-bar {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      margin-bottom: 2rem;
      font-size: 0.9rem;
      color: var(--text-muted);
    }
    .dot {
      width: 10px;
      height: 10px;
      background-color: #22c55e;
      border-radius: 50%;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.4); }
      70% { box-shadow: 0 0 0 6px rgba(34, 197, 94, 0); }
      100% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); }
    }
    /* 瀑布流网格 */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 24px;
    }
    .card {
      background: var(--card-bg);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.04);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }
    .card:hover {
      transform: translateY(-8px);
      box-shadow: 0 20px 40px rgba(0,0,0,0.08);
    }
    .card-image {
      width: 100%;
      height: 240px;
      background-color: #e5e5e5;
      position: relative;
    }
    .card-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .tag {
      position: absolute;
      top: 12px;
      left: 12px;
      background: rgba(255,255,255,0.9);
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 600;
      backdrop-filter: blur(4px);
    }
    .card-content {
      padding: 20px;
    }
    .card-title {
      font-size: 1.15rem;
      font-weight: 700;
      margin-bottom: 8px;
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .card-desc {
      color: var(--text-muted);
      font-size: 0.9rem;
      line-height: 1.6;
    }
    .skeleton {
      background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);
      background-size: 200% 100%;
      animation: loading 1.5s infinite;
    }
    @keyframes loading {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>Inspiration Hub</h1>
    <p>每日抓取全球最新产品造型、参数化结构与新材料趋势</p>
  </header>

  <div class="status-bar" id="statusText">
    <div class="dot"></div>
    <span>正在从外部数据源建立连接并拉取高清素材...</span>
  </div>

  <div class="grid" id="data-grid">
    <!-- 初始的骨架屏，让网页看起来在努力加载 -->
    <div class="card skeleton" style="height: 380px;"></div>
    <div class="card skeleton" style="height: 380px;"></div>
    <div class="card skeleton" style="height: 380px;"></div>
    <div class="card skeleton" style="height: 380px;"></div>
  </div>
</div>

<script>
  // 模拟一些设计相关的标签
  const tags = ["3D Modeling", "CMF Design", "Parametric", "Ergonomics", "Injection Molding", "Smart Hardware"];

  // 使用 Fetch API 真实调用外部网络请求
  async function fetchInspirationData() {
    try {
      // 1. 调用公共 API 获取真实的占位文本数据 (模拟文章标题和简介)
      const textResponse = await fetch('https://jsonplaceholder.typicode.com/posts?_limit=9');
      const textData = await textResponse.json();
      
      const grid = document.getElementById('data-grid');
      grid.innerHTML = ''; // 清除骨架屏

      // 2. 遍历生成真实的 DOM 结构，并调用外部图片 API
      textData.forEach((item, index) => {
        // 利用时间戳和随机种子，强制浏览器每次都向外部请求新的高清图片，产生真实流量
        const randomSeed = new Date().getTime() + index;
        const imageUrl = `https://picsum.photos/600/400?random=${randomSeed}`;
        const randomTag = tags[Math.floor(Math.random() * tags.length)];

        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <div class="card-image">
            <span class="tag">${randomTag}</span>
            <!-- loading="lazy" 模拟现代网页的真实行为 -->
            <img src="${imageUrl}" alt="Design Inspiration ${index}" loading="lazy" onload="this.style.backgroundColor='transparent'">
          </div>
          <div class="card-content">
            <div class="card-title">${item.title}</div>
            <div class="card-desc">${item.body.substring(0, 80)}... 探索更多材质细节。</div>
          </div>
        `;
        grid.appendChild(card);
      });

      document.getElementById('statusText').innerHTML = '<div class="dot"></div><span>素材流已同步，实时监控中</span>';
    } catch (error) {
      document.getElementById('statusText').innerText = '数据源连接超时，请刷新重试。';
    }
  }

  // 延迟 800ms 执行，模拟网络请求的真实体感
  setTimeout(fetchInspirationData, 800);
</script>

</body>
</html>
